<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geotips - GeoGuessr メタ知識データベース</title>
  <!-- フラッシュ防止：CSSが当たる前にlocalStorageのテーマを適用 -->
  <script>
    (function() {
      const saved = localStorage.getItem('theme');
      if (saved) document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/browse.css">
</head>
<body>

  <!-- ヘッダー -->
  <header class="site-header">
    <div>
      <div class="site-title">Geotips</div>
      <div class="site-subtitle">GeoGuessr メタ知識データベース</div>
    </div>
    <div class="header-nav">
      <a href="register.html" class="nav-link">登録フォームへ →</a>
      <button id="theme-toggle" class="theme-toggle-btn" title="テーマ切替">🌙</button>
    </div>
  </header>

  <!-- コントロールバー -->
  <div class="controls">
    <input type="text" id="search" placeholder="キーワード検索（国・地域・メタ知識）">

    <select id="filter-country">
      <option value="">すべての国</option>
    </select>

    <select id="filter-genre">
      <option value="">すべてのジャンル</option>
    </select>

    <select id="filter-scope">
      <option value="">スコープ: すべて</option>
      <option value="Country">Country</option>
      <option value="Region">Region</option>
    </select>

    <select id="sort">
      <option value="date-new">登録日（新しい順）</option>
      <option value="date-old">登録日（古い順）</option>
      <option value="country">国名順</option>
      <option value="genre">ジャンル順</option>
    </select>

    <div class="view-toggle">
      <button id="btn-card" class="active">カード</button>
      <button id="btn-table">テーブル</button>
    </div>
  </div>

  <!-- 件数表示 -->
  <div class="count-bar">
    <span id="count">読み込み中...</span>
  </div>

  <!-- メインコンテンツ（カード or テーブルがここに挿入される） -->
  <main id="main-content"></main>

  <!-- 画像モーダル -->
  <div id="modal" class="modal-overlay hidden">
    <div class="modal-inner">
      <img id="modal-img" src="" alt="拡大画像">
      <div id="modal-credit" class="modal-credit"></div>
    </div>
  </div>

  <script src="data/mock.js"></script>
  <script src="js/common.js"></script>
  <script src="js/gas.js"></script>
  <script src="js/browse.js"></script>
</body>
</html>
